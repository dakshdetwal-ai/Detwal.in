<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — DETwal</title>
    <meta
        name="description"
        content="Create your DETwal account."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <a href="../home/" class="logo">
            DET<span>wal</span>
        </a>

        <a href="../home/" class="back-link">
            ← Back to DETwal
        </a>

    </header>


    <!-- =========================
         SIGNUP
    ========================== -->

    <main class="signup-container">

        <div class="signup-box">

            <div class="signup-header">

                <div class="signup-badge">
                    DETWAL ACCOUNT
                </div>

                <h1>
                    Create your account.
                </h1>

                <p>
                    Join DETwal and access our trading ecosystem.
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <small>
                        Minimum 8 characters
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">

                        I agree to the

                        <a href="../terms/">
                            Terms of Use
                        </a>

                        and

                        <a href="../privacy/">
                            Privacy Policy
                        </a>.

                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="signup-button"
                >

                    <span class="button-text">
                        Create Account
                    </span>

                    <span>
                        →
                    </span>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="../login/">
                    Log in
                </a>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <span>
            © 2026 DETwal
        </span>

        <div>

            <a href="../terms/">
                Terms of Use
            </a>

            <a href="../privacy/">
                Privacy Policy
            </a>

        </div>

    </footer>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <!-- DETWAL SIGNUP SCRIPT -->

    <script src="script.js"></script>

</body>
</html>
